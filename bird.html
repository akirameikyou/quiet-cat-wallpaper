<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>気配の鳥 — 試作プレビュー</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0a0b0e;color:#e8e6e0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
  h1{font-size:15px;font-weight:600;margin:6px 0 0;letter-spacing:.04em}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .bar button{border:1px solid #2a2f38;background:#14171d;color:#e8e6e0;
    border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .bar button.on{border-color:#8a93a6;background:#232833}
  .stage{position:relative;flex:1;width:100%;max-width:460px;border-radius:22px;
    overflow:hidden;border:1px solid #23262d}
  canvas{display:block;width:100%;height:100%}
  .hint{font-size:12px;color:#9aa0a8;text-align:center;max-width:460px;padding:0 6px 6px}
</style>
</head>
<body>
  <h1>気配の鳥</h1>
  <div class="bar" id="bar"></div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="hint">枝にとまり、首をかしげ、羽づくろい、跳ね、さえずり、ふいに空へ。上のボタンで空の色を切替。</div>

<script>
// ===================== 空・枝・鳥の配色（自由設計） =====================
const SKIES = {
  dawn:  {name:"あさ", top:"#f6ddc2", bot:"#eab48a", branch:"#6b4b34",
          body:"#46586b", belly:"#f2c451", wing:"#33465a", beak:"#e8895a", cheek:"#e8895a", eye:"#20242c", leg:"#2b3038", far:"#c98a63"},
  dusk:  {name:"ゆうぐれ", top:"#5b4a72", bot:"#c9738a", branch:"#2e2740",
          body:"#f2c451", belly:"#fbeecb", wing:"#d98f3f", beak:"#7a4a86", cheek:"#e79bb0", eye:"#2a2140", leg:"#3a2f4a", far:"#8a5f86"},
  mist:  {name:"もや", top:"#dfe4e0", bot:"#b8c3bd", branch:"#6e6a5f",
          body:"#7d94a6", belly:"#eef1ea", wing:"#5e7284", beak:"#d98f5a", cheek:"#dca6a0", eye:"#2b3138", leg:"#4a4f52", far:"#9aa79c"},
  night: {name:"よる", top:"#141a2b", bot:"#243049", branch:"#0e1320",
          body:"#cfd6e6", belly:"#eef2f8", wing:"#9aa6c2", beak:"#e0b25a", cheek:"#c98a9a", eye:"#0c1018", leg:"#8a93ab", far:"#3a4considerable"}
};
// fix a typo-safe fallback
SKIES.night.far="#3a4560";
const ORDER=["dawn","dusk","mist","night"];
let sky=SKIES.dawn, skyKey="dawn";

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1, branchY=0;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1);
  const r=cv.parentElement.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  branchY=Math.round(H*0.64); }
window.addEventListener('resize',resize);

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const d2r=d=>d*Math.PI/180;
function tri(a,b,c){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();ctx.fill();}

// ===================== 背景（空＋枝） =====================
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,sky.top); g.addColorStop(1,sky.bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawBranch(){
  ctx.strokeStyle=sky.branch; ctx.lineCap="round"; ctx.lineWidth=Math.max(5,H*0.012);
  ctx.beginPath();
  ctx.moveTo(-10,branchY+6);
  ctx.bezierCurveTo(W*0.3,branchY-4, W*0.62,branchY+8, W+10,branchY-2);
  ctx.stroke();
  // 小枝
  ctx.lineWidth=Math.max(3,H*0.007);
  ctx.beginPath(); ctx.moveTo(W*0.24,branchY+2); ctx.lineTo(W*0.19,branchY-22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.72,branchY+4); ctx.lineTo(W*0.79,branchY-16); ctx.stroke();
  // 小さな葉
  ctx.fillStyle=sky.branch;
  leaf(W*0.19,branchY-24,-0.5); leaf(W*0.79,branchY-18,0.4);
}
function leaf(x,y,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath(); ctx.ellipse(0,-6,4,9,0,0,7); ctx.fill(); ctx.restore(); }

// ===================== 遠くの群れ（気配・奥行き） =====================
let flock=null;
function maybeFlock(now){
  if(!flock && Math.random()<0.0016){ // まれに現れる
    const dir=Math.random()<0.5?1:-1;
    flock={dir, x: dir>0? -40 : W+40, y: rnd(H*0.10,H*0.24), n: Math.floor(rnd(5,9)), t:now};
  }
  if(flock){
    flock.x += flock.dir * (W*0.00028) * 16;
    ctx.fillStyle=sky.far;
    for(let i=0;i<flock.n;i++){
      const px=flock.x - flock.dir*i*13, py=flock.y + Math.sin(i*0.9)*7 + Math.sin((now/500)+i)*1.5;
      const f=(Math.sin(now/160 + i)*0.5+0.5); // 羽ばたき
      ctx.save(); ctx.translate(px,py); if(flock.dir<0) ctx.scale(-1,1);
      ctx.lineWidth=2; ctx.strokeStyle=sky.far; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(-4,-2*f-1); ctx.lineTo(0,0); ctx.lineTo(4,-2*f-1); ctx.stroke();
      ctx.restore();
    }
    if(flock.x < -60 || flock.x > W+60) flock=null;
  }
}

// ===================== 鳥（自由な造形・補間で動く） =====================
// パラメータ: x(枝上位置) y(上下) headTilt beakOpen wingLift tailUp blink faceRight flyAmt
function makeBird(x,faceRight){
  return { x, y:0, targetX:x, faceRight, prevRight:faceRight,
    p:{headTilt:0,beakOpen:0,wingLift:0,tailUp:0,blink:0,lift:0}, // 補間対象
    t:{headTilt:0,beakOpen:0,wingLift:0,tailUp:0,blink:0,lift:0},
    state:'land', st:0, dur:1.6, from:0, to:x, hopFrom:0,hopTo:0, sing:[], guest:false };
}
function approach(b,dt){ const k=1-Math.exp(-dt/0.13);
  for(const key in b.p) b.p[key]+=(b.t[key]-b.p[key])*k; }

function drawBird(b,now){
  const s=Math.min(W,H)*0.0034;
  const flying = b.state==='fly';
  const P=b.p;
  ctx.save();
  ctx.translate(b.x, branchY - b.y - b.p.lift);
  ctx.scale((b.faceRight?1:-1)*s, s);

  // 脚
  if(!flying){
    ctx.strokeStyle=sky.leg; ctx.lineWidth=1.8; ctx.lineCap="round";
    const legLen = 9 + (b.p.lift)/s;
    ctx.beginPath(); ctx.moveTo(-4,9); ctx.lineTo(-5,9+legLen); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,9);  ctx.lineTo(4,9+legLen);  ctx.stroke();
  }
  // 尾（上に跳ね上げ）
  ctx.save(); ctx.translate(-13,-4); ctx.rotate(d2r(-18 - P.tailUp*22));
  ctx.fillStyle=sky.wing; tri([0,-4],[-20,-9],[0,6]); ctx.restore();
  // 体
  ctx.fillStyle=sky.body; ctx.beginPath(); ctx.ellipse(0,-2,17,19,d2r(-8),0,7); ctx.fill();
  // お腹
  ctx.fillStyle=sky.belly; ctx.beginPath(); ctx.ellipse(3,2,10,13,d2r(-6),0,7); ctx.fill();
  // 翼（羽ばたきで持ち上がる）
  ctx.save(); ctx.translate(-1,-3); ctx.rotate(d2r(-P.wingLift*55));
  ctx.fillStyle=sky.wing; ctx.beginPath(); ctx.ellipse(-2,4,9,13,d2r(18),0,7); ctx.fill(); ctx.restore();

  // 頭（かしげる）
  ctx.save(); ctx.translate(9,-15); ctx.rotate(d2r(P.headTilt));
  ctx.fillStyle=sky.body; ctx.beginPath(); ctx.arc(0,0,11,0,7); ctx.fill();
  // 冠羽
  ctx.strokeStyle=sky.wing; ctx.lineWidth=2; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-2,-9); ctx.lineTo(-6,-15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1,-10); ctx.lineTo(0,-17); ctx.stroke();
  // 頬
  ctx.fillStyle=sky.cheek; ctx.globalAlpha=.5; ctx.beginPath(); ctx.arc(-2,3,3.2,0,7); ctx.fill(); ctx.globalAlpha=1;
  // くちばし（開閉）
  ctx.fillStyle=sky.beak;
  const bo=P.beakOpen*2.4;
  tri([9,-2-bo*0.5],[19,0],[9,2+bo*0.5]);
  // 目（まばたき）
  ctx.fillStyle=sky.eye;
  if(P.blink>0.5){ ctx.save(); ctx.scale(1,0.15); ctx.beginPath(); ctx.arc(4,-2/0.15,1.9,0,7); ctx.fill(); ctx.restore(); }
  else { ctx.beginPath(); ctx.arc(4,-2,2.0,0,7); ctx.fill(); }
  ctx.restore();

  ctx.restore();

  // さえずり ♪
  for(const n of b.sing){
    const age=(now-n.t)/1000; if(age>1.6) continue;
    ctx.globalAlpha=clamp(1-age/1.6,0,1)*0.9;
    ctx.fillStyle=sky.branch; ctx.font=`${Math.round(Math.min(W,H)*0.03)}px serif`;
    ctx.fillText("♪", b.x + (b.faceRight?18:-26)*1 + n.dx, branchY - b.y - 26 - age*26);
    ctx.globalAlpha=1;
  }
}
function branchYlocal(){return 0;}

// ===================== 一羽の振る舞い（ディレクター） =====================
let birds=[];
function schedule(b,now){
  // 次の所作を選ぶ
  const r=Math.random();
  if(r<0.30){ b.state='perch'; b.dur=rnd(2.6,5.0); }
  else if(r<0.44){ b.state='tilt'; b.dur=rnd(1.4,2.4); b.tiltDir=Math.random()<0.5?1:-1; }
  else if(r<0.56){ b.state='preen'; b.dur=rnd(1.8,2.8); }
  else if(r<0.68){ b.state='sing'; b.dur=rnd(1.6,2.4); b.sing.push({t:now,dx:rnd(-3,3)}); }
  else if(r<0.80){ b.state='flutter'; b.dur=rnd(0.8,1.2); }
  else if(r<0.92){ b.state='hop'; b.dur=0.5; b.hopFrom=b.x; b.hopTo=clamp(b.x+rnd(-1,1)*W*0.14, W*0.12, W*0.88); b.faceRight=b.hopTo>=b.x; }
  else { b.state='fly'; b.dur=rnd(2.4,3.4);
         const exit=Math.random()<0.4;
         b.from=b.x; b.faceRight=Math.random()<0.5;
         b.to= exit? (b.faceRight? W+60 : -60) : clamp(b.x+rnd(-1,1)*W*0.4, W*0.12,W*0.88);
         b.exit=exit; }
  b.st=now;
}
function updateBird(b,now,dt){
  const el=(now-b.st)/1000, p=clamp(el/b.dur,0,1);
  // 既定の目標
  b.t.headTilt=0; b.t.beakOpen=0; b.t.wingLift=0; b.t.tailUp=0; b.t.blink=0; b.t.lift=0;
  // 呼吸（常時わずかに）
  const breath=Math.sin(now/900)*1.2;

  if(b.state==='land'){
    // 飛んで枝へ舞い降りる
    const q=ease(p); const arc=Math.sin(p*Math.PI);
    b.x=b.from+(b.to-b.from)*q;
    b.t.lift = arc*Math.min(W,H)*0.18/ (Math.min(W,H)*0.0034);
    b.t.wingLift = 0.5+0.5*Math.sin(now/70);
    b.t.tailUp=0.4;
    if(p>=1){ b.x=b.to; b.state='perch'; b.st=now; b.dur=rnd(1.5,3); }
  }
  else if(b.state==='perch'){
    b.t.tailUp = 0.15+0.15*Math.sin(now/1200);
    if(Math.random()<0.006) b.t.blink=1;      // ときどき瞬き
    if(el>b.dur) schedule(b,now);
  }
  else if(b.state==='tilt'){
    const a=Math.sin(p*Math.PI);
    b.t.headTilt = b.tiltDir*18*a; b.t.tailUp=0.2;
    if(p>=1) schedule(b,now);
  }
  else if(b.state==='preen'){
    const a=Math.sin(p*Math.PI);
    b.t.headTilt = -46*a; b.t.beakOpen=0.2*a; b.t.wingLift=0.15*a; b.t.tailUp=0.3*a;
    if(p>=1) schedule(b,now);
  }
  else if(b.state==='sing'){
    b.t.beakOpen = 0.5+0.5*Math.sin(now/90); b.t.headTilt=-6; b.t.tailUp=0.35;
    if(el>0.5 && el<0.55 && Math.random()<0.9) b.sing.push({t:now,dx:rnd(-3,4)});
    if(p>=1) schedule(b,now);
  }
  else if(b.state==='flutter'){
    b.t.wingLift=0.5+0.5*Math.sin(now/55); b.t.tailUp=0.5; b.t.lift=Math.sin(p*Math.PI)*3/ (Math.min(W,H)*0.0034)*0;
    if(p>=1) schedule(b,now);
  }
  else if(b.state==='hop'){
    const arc=Math.sin(p*Math.PI);
    b.x=b.hopFrom+(b.hopTo-b.hopFrom)*p;
    b.t.lift=arc*10/ (Math.min(W,H)*0.0034);
    b.t.wingLift=arc*0.5; b.t.tailUp=0.4;
    if(p>=1){ b.x=b.hopTo; schedule(b,now); }
  }
  else if(b.state==='fly'){
    const q=p; const arc=Math.sin(p*Math.PI);
    b.x=b.from+(b.to-b.from)*q;
    b.t.lift = arc*Math.min(W,H)*0.32/ (Math.min(W,H)*0.0034);
    b.t.wingLift=0.5+0.5*Math.sin(now/60);
    b.t.tailUp=0.5;
    if(p>=1){
      if(b.exit){ // 画面外へ→反対から新たに飛来
        b.faceRight=Math.random()<0.5;
        b.from = b.faceRight? -60 : W+60; b.x=b.from;
        b.to = clamp(rnd(W*0.2,W*0.8),W*0.12,W*0.88);
        b.state='land'; b.st=now; b.dur=rnd(2.0,2.8);
      } else { b.x=b.to; b.state='perch'; b.st=now; b.dur=rnd(1.5,3); }
    }
  }
  // 補間
  b.t.tailUp += 0; // (既に設定済み)
  b.t.lift += breath* ( (b.state==='perch'||b.state==='tilt'||b.state==='sing') ? 0.6:0 );
  approach(b,dt);
}

// ===================== ループ =====================
let lastNow=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0.001,(now-lastNow)/1000)); lastNow=now;
  drawSky();
  maybeFlock(now);
  drawBranch();
  // まれに二羽目（客人）
  if(birds.length<2 && Math.random()<0.0009){
    const gb=makeBird(Math.random()<0.5?-60:W+60, Math.random()<0.5);
    gb.guest=true; gb.state='land'; gb.from=gb.x; gb.to=clamp(rnd(W*0.2,W*0.8),W*0.12,W*0.88); gb.dur=rnd(2.2,3); gb.st=now;
    birds.push(gb);
  }
  for(const b of birds){ updateBird(b,now,dt); drawBird(b,now); }
  // 客人が長く経ったら去る（fly exit任せ）— 二羽で十分
  requestAnimationFrame(frame);
}

// palette buttons
const bar=document.getElementById('bar');
ORDER.forEach(k=>{ const b=document.createElement('button'); b.textContent=SKIES[k].name;
  if(k==='dawn')b.classList.add('on');
  b.onclick=()=>{ sky=SKIES[k]; skyKey=k; [...bar.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); };
  bar.appendChild(b); });

resize();
birds=[ makeBird(W*0.42, true) ];
birds[0].state='land'; birds[0].from=-60; birds[0].x=-60; birds[0].to=W*0.42; birds[0].dur=2.4; birds[0].st=performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
