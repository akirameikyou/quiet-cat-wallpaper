<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>気配の猫 — 動きプレビュー</title>
<style>
  :root{--ink:#e8e6e0;--muted:#9aa0a8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0a0b0e;color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
  h1{font-size:15px;font-weight:600;margin:6px 0 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .bar button{border:1px solid #2a2f38;background:#14171d;color:#e8e6e0;
    border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .bar button.on{border-color:#8a93a6;background:#232833}
  .stage{position:relative;flex:1;width:100%;max-width:460px;border-radius:22px;
    overflow:hidden;border:1px solid #23262d}
  canvas{display:block;width:100%;height:100%}
  .hint{font-size:12px;color:var(--muted);text-align:center;max-width:460px;padding:0 6px 6px}
  .now{position:absolute;top:10px;left:12px;font-size:11px;letter-spacing:.1em;
    color:rgba(0,0,0,.35);font-weight:700}
</style>
</head>
<body>
  <h1>気配の猫 — 動きプレビュー</h1>
  <div class="bar" id="bar"></div>
  <div class="stage"><canvas id="cv"></canvas><span class="now" id="now"></span></div>
  <div class="hint">
    固定寸法の1体を、角度と位置だけ変えて動かします。ポーズ切替は自動で補間（急に飛びません）。<br>
    歩く・走る・座る・寝る・ツメ研ぎ・のぞく をランダムに。上のボタンで背景色を切替。
  </div>

<script>
const PAL = {
  clay:   {bg:"#d69f77", dots:false, head:"#3f4653", body:"#7f93b3", legs:"#465269", tail:"#465269", nose:"#ede7d6", eye:"#ffffff"},
  dots:   {bg:"#e7e0cd", dots:true,  dot:"#cdbfa0", head:"#f39700", body:"#a9713c", legs:"#3a2a18", tail:"#3a2a18", nose:"#3a2a18", eye:"#ffffff"},
  oatmeal:{bg:"#e7e0cd", dots:false, head:"#f39700", body:"#a9713c", legs:"#3a2a18", tail:"#3a2a18", nose:"#3a2a18", eye:"#ffffff"},
  blue:   {bg:"#9fb0c3", dots:false, head:"#1f3f8f", body:"#9aa0a8", legs:"#20242c", tail:"#20242c", nose:"#20242c", eye:"#ffffff"},
  sage:   {bg:"#a7b6a0", dots:false, head:"#f39700", body:"#a9713c", legs:"#20242c", tail:"#20242c", nose:"#20242c", eye:"#ffffff"},
  sumi:   {bg:"#3f4653", dots:false, head:"#f39700", body:"#a9713c", legs:"#e8c73e", tail:"#e8c73e", nose:"#ede7d6", eye:"#ffffff"}
};
const NAMES={clay:"クレイ",dots:"点柄",oatmeal:"オートミール",blue:"ダスティブルー",sage:"セージ",sumi:"すみ"};
let pal=PAL.clay, palKey="clay";

const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), nowLbl=document.getElementById('now');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1);
  const r=cv.parentElement.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize);

function drawBG(){ ctx.fillStyle=pal.bg; ctx.fillRect(0,0,W,H);
  if(pal.dots){ ctx.fillStyle=pal.dot; const st=Math.max(W,H)/18,r=st*0.05;
    for(let y=st/2;y<H;y+=st)for(let x=st/2;x<W;x+=st){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();} } }

// ================== 固定寸法の部品 ==================
const R = { headR:24, legLen:22, legW:8, bw:31, bh:15, brad:15, tailLen:30, tailW:10, eyeR:3.2 };
const d2r = d=>d*Math.PI/180;

function rr(l,t,r,b,rad){ctx.beginPath();ctx.moveTo(l+rad,t);ctx.arcTo(r,t,r,b,rad);ctx.arcTo(r,b,l,b,rad);ctx.arcTo(l,b,l,t,rad);ctx.arcTo(l,t,r,t,rad);ctx.closePath();ctx.fill();}
function hipWorld(P,lx,ly){ const c=Math.cos(P.bodyRot), s=Math.sin(P.bodyRot);
  return {x:P.bodyX + lx*c - ly*s, y:P.bodyY + lx*s + ly*c}; }
function legRod(hip,angDeg,color){ const a=d2r(angDeg);
  const px=hip.x+R.legLen*Math.cos(a), py=hip.y+R.legLen*Math.sin(a);
  ctx.strokeStyle=color; ctx.lineWidth=R.legW; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(hip.x,hip.y); ctx.lineTo(px,py); ctx.stroke(); }
function drawBody(bx,by,rot){ ctx.save(); ctx.translate(bx,by); ctx.rotate(rot);
  ctx.fillStyle=pal.body; rr(-R.bw,-R.bh,R.bw,R.bh,R.brad); ctx.restore(); }
function drawHead(hx,hy){
  ctx.fillStyle=pal.head; ctx.beginPath(); ctx.arc(hx,hy,R.headR,0,7); ctx.fill();
  // 耳（固定形）
  ctx.beginPath();ctx.moveTo(hx-16,hy-20);ctx.lineTo(hx-14,hy-38);ctx.lineTo(hx-2,hy-24);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(hx+2,hy-24);ctx.lineTo(hx+14,hy-38);ctx.lineTo(hx+16,hy-20);ctx.closePath();ctx.fill();
}
function drawTail(base,angDeg){ ctx.save(); ctx.translate(base.x,base.y); ctx.rotate(d2r(angDeg));
  ctx.strokeStyle=pal.tail; ctx.lineWidth=R.tailW; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(R.tailLen,0); ctx.stroke(); ctx.restore(); }

// リグ（横向き基準：鼻＝左、尻＝右）。P は「位置と角度」だけ。寸法は固定。
function drawRig(P){
  const fh=hipWorld(P,-16,14), bh=hipWorld(P,18,14), tb=hipWorld(P,29,-4);
  drawTail(tb,P.tailA);
  legRod(bh,P.backA, shade(pal.legs,0.82));   // 後ろ足（胴の後ろ）
  drawBody(P.bodyX,P.bodyY,P.bodyRot);
  legRod(fh,P.frontA, pal.legs);              // 前足（胴の前）
  drawHead(P.headX,P.headY);
  // 鼻
  ctx.fillStyle=pal.nose; ctx.beginPath(); ctx.ellipse(P.headX-22,P.headY+3,5,2.2,0,0,7); ctx.fill();
  // 目（単眼／開閉）
  ctx.save(); ctx.translate(P.headX+2,P.headY-4);
  if(P.eyeOpen>0.5){ ctx.fillStyle=pal.eye; ctx.beginPath(); ctx.arc(0,0,R.eyeR,0,7); ctx.fill(); }
  else { ctx.strokeStyle=pal.eye; ctx.lineWidth=2.6; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.stroke(); }
  ctx.restore();
}
function shade(hex,f){ const n=parseInt(hex.slice(1),16); const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f); return `rgb(${r},${g},${b})`; }

// 寝る：正面・固定寸法・目を閉じ・鼻/足なし・尻尾は胴の後ろ（フェードで繋ぐ例外）
function drawSleep(now){ const w=now/2400, breath=1+Math.sin(w)*0.02;
  // 尻尾（胴の後ろ）
  ctx.strokeStyle=pal.tail; ctx.lineWidth=R.tailW-1; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(14,-8); ctx.lineTo(40,-12); ctx.stroke();
  // 体（固定寸法のロール・呼吸）
  ctx.save(); ctx.translate(0,-15); ctx.scale(1,breath);
  ctx.fillStyle=pal.body; rr(-R.bw,-R.bh,R.bw,R.bh,R.brad); ctx.restore();
  // 頭
  ctx.fillStyle=pal.head; ctx.beginPath(); ctx.arc(0,-40,R.headR,0,7); ctx.fill();
  ctx.beginPath();ctx.moveTo(-18,-54);ctx.lineTo(-16,-72);ctx.lineTo(-2,-58);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(2,-58);ctx.lineTo(16,-72);ctx.lineTo(18,-54);ctx.closePath();ctx.fill();
  // 閉じ目（間隔広め）
  ctx.strokeStyle=pal.eye; ctx.lineWidth=2.8; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-17,-42); ctx.lineTo(-9,-42); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,-42); ctx.lineTo(17,-42); ctx.stroke();
}

// ================== ポーズ（目標パラメータ＝キーフレーム） ==================
const STAND={bodyX:0,bodyY:-36,bodyRot:0,headX:-36,headY:-48,frontA:90,backA:90,tailA:-18,eyeOpen:1};
function tgtWalk(now,fast){ const w=fast?now/230:now/470, sw=fast?22:14;
  return {bodyX:0,bodyY:-36-Math.abs(Math.sin(w))*2,bodyRot:0,headX:-36,headY:-48,
    frontA:90+Math.sin(w)*sw, backA:90-Math.sin(w)*sw, tailA:-18+Math.sin(w*0.5)*5, eyeOpen:1}; }
const SIT={bodyX:2,bodyY:-27,bodyRot:0.5,headX:-24,headY:-56,frontA:90,backA:205,tailA:-28,eyeOpen:1};
function tgtScratch(now){ const w=now/300;
  return {bodyX:0,bodyY:-20,bodyRot:-1.0,headX:-28,headY:-58,frontA:-70+Math.sin(w)*16,backA:92,tailA:-18,eyeOpen:1}; }
function tgtPeek(now){ const w=now/500;
  return {bodyX:0,bodyY:-36+Math.sin(w)*2,bodyRot:0,headX:-36,headY:-48,frontA:90,backA:90,tailA:-18,eyeOpen:1}; }

function targetFor(name,now){
  if(name==='run') return tgtWalk(now,true);
  if(name==='walk'||name==='goEdge') return tgtWalk(now,false);
  if(name==='sit'||name==='sleep') return SIT;
  if(name==='scratch') return tgtScratch(now);
  if(name==='peek') return tgtPeek(now);
  return STAND;
}

// ================== 補間（インビトウィーニング） ==================
const KEYS=['bodyX','bodyY','bodyRot','headX','headY','frontA','backA','tailA','eyeOpen'];
let cur=Object.assign({},STAND); let sleepAmt=0;
function approach(T,dt,tau){ const k=1-Math.exp(-dt/tau); for(const key of KEYS) cur[key]+=(T[key]-cur[key])*k; }

// ================== ディレクター ==================
let cat={x:-200}; let curAct=null, t0=0, poseName='walk', dir=1;
function S(){ return Math.min(W,H)*0.0026; }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function cornerX(){ return Math.random()<0.5 ? W*0.14 : W*0.86; }
function pushWalk(tx){queue.push({type:'walk',toX:tx});}
function restAtCorner(){ if(Math.random()<0.3) queue.push({type:'sleep',dur:14+Math.random()*10}); else queue.push({type:'sit',dur:10+Math.random()*9}); }
let queue=[];
function plan(){
  const s=S(), pad=150*s;
  if(cat.x<-pad+5||cat.x>W+pad-5){ queue.push({type:'enter',toX:cornerX()}); restAtCorner(); return; }
  const k=Math.random();
  if(k<0.56){ pushWalk(cornerX()); restAtCorner(); }
  else if(k<0.70){ const e=Math.random()<0.5; queue.push({type:'goEdge',right:e}); queue.push({type:'peek',dur:5,right:e}); queue.push({type:'enter',toX:cornerX()}); queue.push({type:'sit',dur:9+Math.random()*7}); }
  else if(k<0.84){ const e=Math.random()<0.5; pushWalk(e?W*0.9:W*0.1); queue.push({type:'scratch',dur:5.5,right:e}); queue.push({type:'sit',dur:8+Math.random()*6}); }
  else if(k<0.92){ pushWalk(W*(0.2+Math.random()*0.6)); queue.push({type:'sit',dur:5+Math.random()*5}); }
  else { queue.push({type:'run', right: cat.x<W/2}); queue.push({type:'enter',toX:cornerX()}); queue.push({type:'sit',dur:6+Math.random()*6}); }
}
function startAct(){ curAct=queue.shift(); t0=performance.now(); if(!curAct)return; const s=S();
  if(curAct.type==='enter'){ cat.x=(curAct.toX<W/2)?-150*s:W+150*s; curAct.fromX=cat.x; dir=(curAct.toX>cat.x)?-1:1; curAct.dur=Math.max(1.2,Math.abs(curAct.toX-cat.x)/(W*0.05)); poseName='walk'; }
  else if(curAct.type==='walk'){ curAct.fromX=cat.x; dir=(curAct.toX>cat.x)?-1:1; curAct.dur=Math.max(1.0,Math.abs(curAct.toX-cat.x)/(W*0.05)); poseName='walk'; }
  else if(curAct.type==='run'){ curAct.fromX=cat.x; curAct.toX=curAct.right?W+160*s:-160*s; dir=curAct.right?-1:1; curAct.dur=Math.max(0.8,Math.abs(curAct.toX-cat.x)/(W*0.16)); poseName='run'; }
  else if(curAct.type==='goEdge'){ curAct.fromX=cat.x; curAct.toX=curAct.right?W+160*s:-160*s; dir=curAct.right?-1:1; curAct.dur=Math.max(1.0,Math.abs(curAct.toX-cat.x)/(W*0.06)); poseName='goEdge'; }
  else if(curAct.type==='peek'){ dir=curAct.right?1:-1; cat.x=curAct.right? W-8 : 8; poseName='peek'; }
  else if(curAct.type==='scratch'){ dir=curAct.right?-1:1; poseName='scratch'; }
  else if(curAct.type==='sit'){ dir=cat.x<W/2?-1:1; poseName='sit'; }
  else if(curAct.type==='sleep'){ dir=cat.x<W/2?-1:1; poseName='sleep'; }
}
const JP={walk:"あるく",run:"はしる",goEdge:"あるく",sit:"すわる",sleep:"ねる",scratch:"ツメ研ぎ",peek:"のぞく",enter:"あるく"};

let lastNow=performance.now();
function frame(now){
  if(!curAct){ if(queue.length===0) plan(); startAct(); }
  const dt=Math.min(0.05,Math.max(0.001,(now-lastNow)/1000)); lastNow=now;
  const s=S(), gy=H*0.86;
  // 位置
  if(curAct){
    const p=(now-t0)/1000/(curAct.dur||1);
    if(poseName==='walk'||poseName==='run'||poseName==='goEdge'){ const q=clamp(p,0,1); cat.x=curAct.fromX+(curAct.toX-curAct.fromX)*ease(q); }
    if(p>=1) curAct=null;
  }
  // 目標へ補間
  const T=targetFor(poseName,now);
  approach(T,dt,0.16);
  sleepAmt += ((poseName==='sleep'?1:0)-sleepAmt)*(1-Math.exp(-dt/0.4));
  // 描画
  drawBG();
  nowLbl.textContent=NAMES[palKey]+" ・ "+(JP[poseName]||"");
  // リグ（寝るときは薄く）
  ctx.save(); ctx.translate(cat.x,gy); ctx.scale(dir*s,s);
  ctx.globalAlpha=1-sleepAmt; drawRig(cur); ctx.globalAlpha=1; ctx.restore();
  if(sleepAmt>0.02){ ctx.save(); ctx.translate(cat.x,gy); ctx.scale(s,s); ctx.globalAlpha=sleepAmt; drawSleep(now); ctx.globalAlpha=1; ctx.restore(); }
  requestAnimationFrame(frame);
}

const bar=document.getElementById('bar');
Object.keys(PAL).forEach(k=>{ const b=document.createElement('button'); b.textContent=NAMES[k];
  if(k==='clay')b.classList.add('on');
  b.onclick=()=>{ pal=PAL[k]; palKey=k; [...bar.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); };
  bar.appendChild(b); });

resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
