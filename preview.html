<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>気配の猫 — 動きプレビュー</title>
<style>
  :root{--ink:#e8e6e0;--muted:#9aa0a8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0a0b0e;color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
  h1{font-size:15px;font-weight:600;margin:6px 0 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .bar button{border:1px solid #2a2f38;background:#14171d;color:#e8e6e0;
    border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .bar button.on{border-color:#8a93a6;background:#232833}
  .stage{position:relative;flex:1;width:100%;max-width:460px;border-radius:22px;
    overflow:hidden;border:1px solid #23262d}
  canvas{display:block;width:100%;height:100%}
  .hint{font-size:12px;color:var(--muted);text-align:center;max-width:460px;padding:0 6px 6px}
  .now{position:absolute;top:10px;left:12px;font-size:11px;letter-spacing:.1em;
    color:rgba(0,0,0,.35);font-weight:700}
</style>
</head>
<body>
  <h1>気配の猫 — 動きプレビュー</h1>
  <div class="bar" id="bar"></div>
  <div class="stage"><canvas id="cv"></canvas><span class="now" id="now"></span></div>
  <div class="hint">
    手足は2本・関節で回るだけ（長さ固定）／尻尾はまっすぐ／胴と比率はそのまま。<br>
    歩く・座る・伸び・ツメ研ぎ・ジャンプ・のぞく・休む をランダムに。上のボタンで背景色を切替。
  </div>

<script>
const PAL = {
  clay:   {bg:"#d69f77", dots:false, head:"#3f4653", body:"#7f93b3", legs:"#465269", tail:"#465269", nose:"#ede7d6", eye:"#ffffff"},
  dots:   {bg:"#e7e0cd", dots:true,  dot:"#cdbfa0", head:"#f39700", body:"#a9713c", legs:"#3a2a18", tail:"#3a2a18", nose:"#3a2a18", eye:"#ffffff"},
  oatmeal:{bg:"#e7e0cd", dots:false, head:"#f39700", body:"#a9713c", legs:"#3a2a18", tail:"#3a2a18", nose:"#3a2a18", eye:"#ffffff"},
  blue:   {bg:"#9fb0c3", dots:false, head:"#1f3f8f", body:"#9aa0a8", legs:"#20242c", tail:"#20242c", nose:"#20242c", eye:"#ffffff"},
  sage:   {bg:"#a7b6a0", dots:false, head:"#f39700", body:"#a9713c", legs:"#20242c", tail:"#20242c", nose:"#20242c", eye:"#ffffff"},
  sumi:   {bg:"#3f4653", dots:false, head:"#f39700", body:"#a9713c", legs:"#e8c73e", tail:"#e8c73e", nose:"#ede7d6", eye:"#ffffff"}
};
const NAMES={clay:"クレイ",dots:"点柄",oatmeal:"オートミール",blue:"ダスティブルー",sage:"セージ",sumi:"すみ"};
let pal=PAL.clay, palKey="clay";

const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), nowLbl=document.getElementById('now');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1);
  const r=cv.parentElement.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize);

function drawBG(){ ctx.fillStyle=pal.bg; ctx.fillRect(0,0,W,H);
  if(pal.dots){ ctx.fillStyle=pal.dot; const st=Math.max(W,H)/18,r=st*0.05;
    for(let y=st/2;y<H;y+=st)for(let x=st/2;x<W;x+=st){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();} } }

// ===== neko-1 の猫（比率そのまま／単眼／まっすぐ尻尾／2本の剛体脚） =====
// local: head(199.3,160.9,r32.7), body capsule(210.7..263.5,177..204.6), tail(258.6..287.1,181.8..188.1)
// nose(164.7,168.8), eye(198.9,162.1), 前股(221,198) 後股(253,196), 脚長21（固定）
const Hf=[221,197], Hb=[253,197], LEGLEN=21;
function tri(a,b,c){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();ctx.fill();}
function rr(l,t,r,b,rad){ctx.beginPath();ctx.moveTo(l+rad,t);ctx.arcTo(r,t,r,b,rad);ctx.arcTo(r,b,l,b,rad);ctx.arcTo(l,b,l,t,rad);ctx.arcTo(l,t,r,t,rad);ctx.closePath();ctx.fill();}
function legRod(hip,ang,color,w){ const px=hip[0]+LEGLEN*Math.cos(ang), py=hip[1]+LEGLEN*Math.sin(ang);
  ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(hip[0],hip[1]);ctx.lineTo(px,py);ctx.stroke(); }

function drawNeko(catX, groundY, s, dir, o){
  o=o||{};
  const frontA=o.frontA!=null?o.frontA:d2r(128);
  const backA =o.backA !=null?o.backA :d2r(60);
  const bodyRot=o.bodyRot||0, blink=o.blink||0, headExtra=o.headExtra||0, tailA=o.tailA||0;
  const sx=catX - dir*s*222.9;
  const sy=groundY - s*210 + (o.dy||0);
  ctx.save();
  ctx.translate(sx,sy); ctx.scale(dir*s, s);
  // 剛体の全身回転（爪とぎ/伸び用・比率は保つ）
  const px=o.px!=null?o.px:235, py=o.py!=null?o.py:208;
  ctx.translate(px,py); ctx.rotate(bodyRot); ctx.translate(-px,-py);

  // 尻尾（まっすぐ・剛体・根元で上下に回るだけ／曲げない）
  ctx.save(); ctx.translate(258.6,185); ctx.rotate(tailA); ctx.translate(-258.6,-185);
  ctx.fillStyle=pal.tail; rr(258.6,181.77,287.12,188.07,3.15); ctx.restore();
  // 胴（歪めない）
  ctx.fillStyle=pal.body; rr(210.74,177.04,263.5,204.6,13.78);
  // 手足（2本とも胴の前面に）
  legRod(Hb, backA, pal.legs, 7);
  legRod(Hf, frontA, pal.legs, 7);
  // 頭
  ctx.save(); ctx.translate(0,headExtra);
  ctx.fillStyle=pal.head; ctx.beginPath();ctx.arc(199.321,160.902,32.677,0,7);ctx.fill();
  tri([172.69,141.24],[171.76,126.45],[184.80,133.19]);
  tri([211.59,132.00],[196.77,131.65],[204.62,119.25]);
  // 鼻
  ctx.fillStyle=pal.nose; ctx.beginPath();ctx.ellipse(164.676,168.775,5.906,2.461,0,0,7);ctx.fill();
  // 目（単眼・白点／まばたき）
  ctx.fillStyle=pal.eye;
  if(blink>0.5){ ctx.save();ctx.translate(198.929,162.083);ctx.scale(1,0.18);ctx.beginPath();ctx.arc(0,0,3.149,0,7);ctx.fill();ctx.restore(); }
  else { ctx.beginPath();ctx.arc(198.929,162.083,3.149,0,7);ctx.fill(); }
  ctx.restore();

  ctx.restore();
}
function d2r(d){return d*Math.PI/180;}

// ===== poses set options; cat roams as before =====
function poseWalk(x,groundY,s,dir,now,fast){ const w=fast?now/230:now/470; const sw=fast?22:12; // トコトコ / 走り
  drawNeko(x,groundY,s,dir,{ frontA:d2r(96+Math.sin(w)*sw), backA:d2r(84-Math.sin(w)*sw),
    tailA:d2r(fast?-24:-12)+Math.sin(w*0.5)*d2r(5), dy:-Math.abs(Math.sin(w))*(fast?3:1.4)*s }); }
// 座る：neko-3 の座り姿そのもの（あなたの原案パスを使用）。頭上げ・お尻接地・前足踏ん張り。
const SIT_CX=320, SIT_CY=256, SIT_FEET=309;
function poseSit(x,groundY,s0,dir,now){
  const s = s0*(22/32.677); // 頭を歩きと同じ大きさに揃える（歩きの頭r22 / neko-3の頭r32.677）
  ctx.save();
  ctx.translate(x, groundY - (SIT_FEET-SIT_CY)*s);
  ctx.scale(dir*s, s);
  ctx.translate(-SIT_CX,-SIT_CY);
  const P=(d,c)=>{ ctx.fillStyle=c; ctx.fill(new Path2D(d)); };
  // 尻尾
  P("M367.273,267.946c1.195,1.265,1.139,3.258-0.126,4.452l-16.597,15.684c-1.265,1.194-3.258,1.138-4.452-0.126l0,0c-1.195-1.265-1.139-3.258,0.126-4.452l16.597-15.684C364.085,266.625,366.079,266.682,367.273,267.946z", pal.tail);
  // お尻〜胴（後ろ足はこの中）
  P("M349.348,300.288c-4.287,6.288-12.858,7.911-19.147,3.625l-20.82-14.191c-6.289-4.286-7.912-12.858-3.625-19.146l0,0c4.286-6.288,12.857-7.911,19.146-3.625l20.82,14.191C352.011,285.427,353.634,294,349.348,300.288z", pal.body);
  // 前足（2本）
  P("M313.798,285.638c2.076,0.645,3.238,2.849,2.595,4.926l-5.595,18.051c-0.645,2.076-2.85,3.238-4.926,2.595l0,0c-2.077-0.644-3.239-2.849-2.596-4.926l5.595-18.051C309.515,286.157,311.721,284.995,313.798,285.638z", pal.legs);
  P("M336.533,290.656c1.85-1.143,4.177-0.729,5.199,0.925l8.881,14.373c1.021,1.652,0.35,3.919-1.499,5.063l0,0c-1.85,1.143-4.178,0.729-5.2-0.924l-8.881-14.373C334.011,294.066,334.682,291.798,336.533,290.656z", pal.legs);
  // 頭
  ctx.fillStyle=pal.head; ctx.beginPath(); ctx.arc(308.84,242.573,32.677,0,7); ctx.fill();
  // 耳
  P("M284.816,219.795c-0.141,0.068-0.246-0.005-0.233-0.159l1.122-14.638c0.012-0.155,0.127-0.211,0.256-0.123l12.116,8.291c0.129,0.089,0.119,0.216-0.021,0.283L284.816,219.795z", pal.head);
  P("M324.557,215.396c0.055,0.146-0.026,0.245-0.18,0.22l-14.486-2.385c-0.153-0.025-0.198-0.146-0.101-0.265l9.309-11.354c0.099-0.121,0.225-0.1,0.279,0.046L324.557,215.396z", pal.head);
  // 鼻
  ctx.save(); ctx.translate(273.491,246.141); ctx.rotate(0.1226); ctx.fillStyle=pal.nose; ctx.beginPath(); ctx.ellipse(0,0,5.906,2.461,0,0,7); ctx.fill(); ctx.restore();
  // 目（単眼）
  ctx.fillStyle=pal.eye; ctx.beginPath(); ctx.arc(308.305,243.696,3.15,0,7); ctx.fill();
  ctx.restore();
}
// 寝る：正面・目を閉じた丸まりロール（目は広め・胴は小さめ・鼻/足なし・尻尾は胴の後ろ）
function poseSleep(x,groundY,s,dir,now){ const w=now/2400; const breath=1+Math.sin(w)*0.02;
  ctx.save(); ctx.translate(x,groundY); ctx.scale(s, s); // 正面（左右反転しない）
  // 尻尾（胴体の後ろ・後ろから少しだけのぞく）
  ctx.strokeStyle=pal.tail; ctx.lineWidth=9; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(8,-9); ctx.lineTo(34,-13); ctx.stroke();
  // 体（小さめのロール・呼吸でわずかに上下／尻尾を隠す）
  ctx.save(); ctx.translate(0,-9); ctx.scale(1,breath);
  ctx.fillStyle=pal.body; rr(-24,-10,24,10,10); ctx.restore();
  // 頭
  ctx.fillStyle=pal.head; ctx.beginPath(); ctx.arc(0,-38,24,0,7); ctx.fill();
  // 耳
  ctx.beginPath();ctx.moveTo(-18,-52);ctx.lineTo(-16,-70);ctx.lineTo(-2,-56);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(2,-56);ctx.lineTo(16,-70);ctx.lineTo(18,-52);ctx.closePath();ctx.fill();
  // 閉じた目（間隔を広く）
  ctx.strokeStyle=pal.eye; ctx.lineWidth=2.8; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-17,-40); ctx.lineTo(-9,-40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,-40); ctx.lineTo(17,-40); ctx.stroke();
  ctx.restore();
}
function poseStretch(x,groundY,s,dir,p,now){ const a=Math.sin(p*Math.PI);
  drawNeko(x,groundY,s,dir,{ frontA:d2r(128+a*40), backA:d2r(60-a*26), tailA:d2r(-6-a*18), bodyRot:-0.10*a*dir, dy:a*4*s }); }
function poseScratch(x,groundY,s,dir,now){ const w=now/300; // 後ろ足を地面につけたまま壁に立ち上がる
  drawNeko(x,groundY,s,dir,{ bodyRot:-1.05*dir, px:255, py:218, frontA:d2r(-96+Math.sin(w)*15), backA:d2r(90), tailA:d2r(-16) }); }
function poseJump(x,groundY,s,dir,p){ const up=Math.sin(p*Math.PI)*80;
  drawNeko(x,groundY,s,dir,{ frontA:d2r(150), backA:d2r(34), tailA:d2r(-28), bodyRot:-0.12*dir, dy:-up*s }); }
function posePeek(edgeRight,groundY,s,now){ const w=now/500; const dir=edgeRight?-1:1;
  const x = edgeRight? W - s*60 : s*60; // 頭だけ画面内、体は端の外へ
  drawNeko(x, H*0.66, s, dir, { frontA:d2r(150), backA:d2r(70), tailA:d2r(-10), dy:Math.sin(w)*3*s }); }

function hexA(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

// ===== director（前と同様に画面を行きかう） =====
let cat={x:-200, faceRight:false};
let queue=[], cur=null, t0=0;
function S(){ return Math.min(W,H)*0.0022; }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function pushWalk(tx){queue.push({type:'walk',toX:tx});}
function cornerX(){ return Math.random()<0.5 ? W*0.12 : W*0.88; }
function restAtCorner(){ if(Math.random()<0.28) queue.push({type:'sleep',dur:14+Math.random()*10}); else queue.push({type:'sit',dur:10+Math.random()*9}); }
function plan(){
  const s=S(), pad=140*s;
  if(cat.x<-pad+5||cat.x>W+pad-5){ const cxr=cornerX();
    queue.push({type:'enter',toX:cxr}); restAtCorner(); return; }
  const k=Math.random();
  if(k<0.56){ // 基本：隅に座る／ときどき寝る
    pushWalk(cornerX()); restAtCorner();
  } else if(k<0.70){ // 顔だけのぞく→隅で座る
    const e=Math.random()<0.5; queue.push({type:'goEdge',right:e}); queue.push({type:'peek',dur:5,right:e});
    queue.push({type:'enter',toX:cornerX()}); queue.push({type:'sit',dur:9+Math.random()*7});
  } else if(k<0.84){ // 端で爪とぎ→その場で座る
    const e=Math.random()<0.5; pushWalk(e?W*0.90:W*0.10); queue.push({type:'scratch',dur:5.5,right:e});
    queue.push({type:'sit',dur:8+Math.random()*6});
  } else if(k<0.91){ // トコトコ散歩→座る
    pushWalk(W*(0.2+Math.random()*0.6)); queue.push({type:'sit',dur:5+Math.random()*5});
  } else { // 走って横切る→隅で座る
    queue.push({type:'run', right: cat.x < W/2}); queue.push({type:'enter',toX:cornerX()}); queue.push({type:'sit',dur:6+Math.random()*6});
  }
}
function start(){ cur=queue.shift(); t0=performance.now(); if(!cur)return; const s=S();
  if(cur.type==='enter'){ cat.x=(cur.toX<W/2)?-140*s:W+140*s; cur.fromX=cat.x; cur.faceRight=cur.toX>cat.x; cat.faceRight=cur.faceRight; cur.dur=Math.max(1.2,Math.abs(cur.toX-cat.x)/(W*0.045)); cur.type='walk'; }
  else if(cur.type==='walk'){ cur.fromX=cat.x; cur.faceRight=cur.toX>cat.x; cat.faceRight=cur.faceRight; cur.dur=Math.max(1.0,Math.abs(cur.toX-cat.x)/(W*0.045)); }
  else if(cur.type==='run'){ cur.fromX=cat.x; cur.toX=cur.right?W+150*s:-150*s; cur.faceRight=cur.right; cat.faceRight=cur.right; cur.dur=Math.max(0.8,Math.abs(cur.toX-cat.x)/(W*0.16)); }
  else if(cur.type==='goEdge'){ cur.fromX=cat.x; cur.toX=cur.right?W+150*s:-150*s; cur.faceRight=cur.right; cat.faceRight=cur.right; cur.dur=Math.max(1.0,Math.abs(cur.toX-cat.x)/(W*0.05)); }
  else if(cur.type==='scratch'){ cat.faceRight=cur.right; }
  else if(cur.type==='sit'||cur.type==='sleep'){ cat.faceRight = cat.x < W*0.5; }
}
const JP={walk:"あるく",run:"はしる",sit:"すわる",sleep:"ねる",scratch:"ツメ研ぎ",peek:"のぞく"};

function frame(now){
  if(!cur){ if(queue.length===0) plan(); start(); }
  const s=S(), gy=H*0.86, dir=cat.faceRight?-1:1;
  const p = cur? (now-t0)/1000/(cur.dur||1) : 0;
  drawBG();
  nowLbl.textContent = NAMES[palKey]+" ・ "+(JP[cur?cur.type:'walk']||"");
  if(cur){
    if(cur.type==='walk'){ const q=clamp(p,0,1); cat.x=cur.fromX+(cur.toX-cur.fromX)*ease(q); poseWalk(cat.x,gy,s,dir,now,false); if(p>=1)cur=null; }
    else if(cur.type==='run'){ const q=clamp(p,0,1); cat.x=cur.fromX+(cur.toX-cur.fromX)*ease(q); poseWalk(cat.x,gy,s,dir,now,true); if(p>=1)cur=null; }
    else if(cur.type==='goEdge'){ const q=clamp(p,0,1); cat.x=cur.fromX+(cur.toX-cur.fromX)*ease(q); poseWalk(cat.x,gy,s,dir,now,false); if(p>=1)cur=null; }
    else if(cur.type==='sit'){ poseSit(cat.x,gy,s,dir,now); if(p>=1)cur=null; }
    else if(cur.type==='sleep'){ poseSleep(cat.x,gy,s,dir,now); if(p>=1)cur=null; }
    else if(cur.type==='stretch'){ poseStretch(cat.x,gy,s,dir,clamp(p,0,1),now); if(p>=1)cur=null; }
    else if(cur.type==='scratch'){ poseScratch(cat.x,gy,s,dir,now); if(p>=1)cur=null; }
    else if(cur.type==='jump'){ const q=clamp(p,0,1); cat.x=cur.fromX+(cur.toX-cur.fromX)*q; poseJump(cat.x,gy,s,dir,q); if(p>=1)cur=null; }
    else if(cur.type==='peek'){ posePeek(cur.right,gy,s,now); if(p>=1)cur=null; }
    else cur=null;
  }
  requestAnimationFrame(frame);
}

const bar=document.getElementById('bar');
Object.keys(PAL).forEach(k=>{ const b=document.createElement('button'); b.textContent=NAMES[k];
  if(k==='clay')b.classList.add('on');
  b.onclick=()=>{ pal=PAL[k]; palKey=k; [...bar.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); };
  bar.appendChild(b); });

resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
