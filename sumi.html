<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>にじみ — 淡墨</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f3ecdd}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:#8a7f6c;font:13px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    letter-spacing:.16em;opacity:0;transition:opacity 1.4s;pointer-events:none}
  #hint.show{opacity:.6}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">ふれると、にじむ</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const PAPER="#f3ecdd";
// 墨はほぼ温かい黒。ごくまれに、わずかな冷たみ（斑ではなく全体の下地）
const INKS=[ "#2b2620","#2b2620","#2b2620","#2b2620","#2a2a2e" ];

// 紙（地＋粒）を一度だけ作って毎フレーム敷く
const paper=document.createElement('canvas'), pctx=paper.getContext('2d');
function buildPaper(){
  if(W<1||H<1) return;
  paper.width=W; paper.height=H;
  pctx.setTransform(1,0,0,1,0,0);
  pctx.fillStyle=PAPER; pctx.fillRect(0,0,W,H);
  pctx.save(); pctx.globalAlpha=.05;
  const n=Math.min(3000, (W*H)/420);
  for(let i=0;i<n;i++){ const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.1;
    pctx.fillStyle=Math.random()<.5?"#000":"#fff"; pctx.beginPath();pctx.arc(x,y,r,0,7);pctx.fill(); }
  pctx.restore();
  // ほのかな四隅の陰り
  const g=pctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3, W/2,H/2,Math.max(W,H)*0.7);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(60,50,35,0.05)");
  pctx.fillStyle=g; pctx.fillRect(0,0,W,H);
}
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildPaper();
}
window.addEventListener('resize',resize);

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

// にじみ一滴：淡い滲み＋紙の繊維に沿う毛細の枝。溜めず、毎フレーム描き直して淡く保つ。
class Stain{
  constructor(x,y,scale){
    this.x=x; this.y=y; this.age=0;
    this.ink=INKS[Math.floor(Math.random()*INKS.length)];
    this.maxR=rnd(34,88)*scale;
    this.growT=rnd(1.0,1.9);
    this.life=rnd(16,30);
    this.strength=rnd(0.7,1.05);
    // 毛細（繊維に沿ってほどける縁）
    this.fibers=[];
    const m=Math.floor(rnd(12,22));
    for(let i=0;i<m;i++){
      this.fibers.push({ a:rnd(0,Math.PI*2), len:rnd(0.75,1.35), w:rnd(0.5,1.7),
        wander:rnd(0.10,0.28), ph:rnd(0,6.28), br:rnd(0.5,1) });
    }
    // 芯のわずかな濃み
    this.coreR=rnd(4,9)*scale;
  }
  env(){ const fin=0.6, fout=6.0;
    if(this.age<fin) return easeOut(this.age/fin);
    if(this.age>this.life-fout) return clamp((this.life-this.age)/fout,0,1);
    return 1; }
  draw(){
    const a=this.env(); if(a<=0) return;
    const rr=this.maxR*easeOut(this.age/this.growT);
    const A=a*this.strength;
    ctx.globalCompositeOperation='multiply';
    // 本体の淡いにじみ（中心やや濃く、縁は消える）
    const g=ctx.createRadialGradient(this.x,this.y, this.coreR, this.x,this.y, rr);
    g.addColorStop(0, hexA(this.ink, 0.13*A));
    g.addColorStop(0.55, hexA(this.ink, 0.05*A));
    g.addColorStop(1, hexA(this.ink, 0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(this.x,this.y,rr,0,7); ctx.fill();
    // 毛細の枝（縁を羽のようにほどく）
    ctx.lineCap='round';
    for(const f of this.fibers){
      const len=rr*f.len; if(len<2) continue;
      ctx.strokeStyle=hexA(this.ink, 0.06*A*f.br);
      ctx.lineWidth=f.w;
      let px=this.x, py=this.y, ang=f.a;
      const steps=6; ctx.beginPath(); ctx.moveTo(px,py);
      for(let s=1;s<=steps;s++){ ang+=f.wander*Math.sin(s*1.6+f.ph);
        const seg=len/steps*(1 - (s/steps)*0.3); // 先ほど細く短く
        px+=Math.cos(ang)*seg; py+=Math.sin(ang)*seg; ctx.lineTo(px,py); }
      ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  }
  get dead(){ return this.age>this.life; }
}

let stains=[];
function addStain(x,y,small){
  const scale=(small?rnd(0.4,0.7):rnd(0.8,1.5))*(Math.min(W,H)/460);
  stains.push(new Stain(x,y,scale));
  if(stains.length>7) stains.shift(); // 溜めない
}

// ひとりでに、まれに落ちる（間隔は長め）
let nextAuto=performance.now()+2600;
function maybeAuto(now){
  if(now>nextAuto){ addStain(rnd(W*0.14,W*0.86), rnd(H*0.14,H*0.82), false);
    nextAuto=now+rnd(7000,13000); }
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);            // 何があってもループを止めない
  if(W<1||H<1||paper.width<1) return;
  const dt=Math.min(0.05,Math.max(0.001,(now-last)/1000)); last=now;
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(paper,0,0,W,H);            // 紙を敷き直す（溜まらない）
  maybeAuto(now);
  for(const s of stains){ s.age+=dt; s.draw(); }
  stains=stains.filter(s=>!s.dead);
}

function pos(e){ const t=e.touches?e.touches[0]:e; return [t.clientX,t.clientY]; }
cv.addEventListener('pointerdown', e=>{ const [x,y]=pos(e); addStain(x,y,false); });
let lastMove=0;
cv.addEventListener('pointermove', e=>{ if((e.buttons&1)||e.pressure>0){
  const t=performance.now(); if(t-lastMove>120){ lastMove=t; const [x,y]=pos(e); addStain(x,y,true); } }});

resize();
setTimeout(()=>addStain(W*0.5,H*0.42,false),700);
const hint=document.getElementById('hint');
setTimeout(()=>hint.classList.add('show'),1300);
setTimeout(()=>hint.classList.remove('show'),6500);
requestAnimationFrame(frame);
</script>
</body>
</html>
