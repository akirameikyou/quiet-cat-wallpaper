<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ともしび</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0c0a0e}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:#9a8a6a;font:13px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    letter-spacing:.18em;opacity:0;transition:opacity 1.6s;pointer-events:none}
  #hint.show{opacity:.5}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">そっと、ふれてみて</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize);
const rnd=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// 温かい闇（下ほど深く、灯のまわりだけ仄あかるい）
function drawNight(now){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#161219"); g.addColorStop(0.55,"#100d13"); g.addColorStop(1,"#0a080b");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

// 灯（ひとつ、呼吸する）
const lamp={ x:0,y:0, set(){ this.x=W*0.5; this.y=H*0.52; } };
function drawLamp(now){
  const br=0.82+0.18*Math.sin(now*0.0016)+0.05*Math.sin(now*0.0043+1);
  const R=Math.min(W,H)*0.26;
  ctx.globalCompositeOperation='lighter';
  // 大きな仄あかり
  let g=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,R);
  g.addColorStop(0,`rgba(255,196,120,${0.16*br})`);
  g.addColorStop(0.4,`rgba(240,150,80,${0.06*br})`);
  g.addColorStop(1,"rgba(240,150,80,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lamp.x,lamp.y,R,0,TAU); ctx.fill();
  // 芯
  const cr=Math.min(W,H)*0.02*(0.9+0.2*Math.sin(now*0.006));
  g=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,cr*3);
  g.addColorStop(0,`rgba(255,240,210,${0.9*br})`);
  g.addColorStop(0.5,`rgba(255,200,130,${0.5*br})`);
  g.addColorStop(1,"rgba(255,200,130,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lamp.x,lamp.y,cr*3,0,TAU); ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

// 火の粉（蛍のように漂い、気配のある所へ集まる）
const HUES=[[255,200,120],[255,214,150],[255,178,96],[255,236,200],[188,214,255]];
class Ember{
  constructor(){ this.reset(true); }
  reset(spread){
    const ang=rnd(0,TAU), rad=spread? rnd(0, Math.min(W,H)*0.42) : Math.min(W,H)*rnd(0.35,0.6);
    this.x=lamp.x+Math.cos(ang)*rad; this.y=lamp.y+Math.sin(ang)*rad*0.8;
    this.vx=rnd(-6,6); this.vy=rnd(-6,6);
    this.col=HUES[Math.floor(Math.random()*HUES.length)];
    this.size=rnd(1.2,3.2); this.ph=rnd(0,TAU); this.rate=rnd(0.6,1.6);
    this.warm=rnd(0.6,1);
  }
  step(now,dt){
    // ゆるい漂い（curlっぽい揺らぎ）
    const t=now*0.0004;
    this.vx += Math.cos(this.y*0.01+t*3+this.ph)*4*dt;
    this.vy += Math.sin(this.x*0.01+t*2.3-this.ph)*4*dt - 2*dt; // ほのかに上へ（火の粉）
    // 気配（灯＋触れた所）へ、そっと引かれる
    let tx=lamp.x, ty=lamp.y, pull=0.5;
    if(attract.a>0){ tx=attract.x; ty=attract.y; pull=0.7*attract.a; } // 壁紙用：吸い寄せをゆっくり
    this.vx += (tx-this.x)*0.009*pull*dt*6;
    this.vy += (ty-this.y)*0.009*pull*dt*6;
    this.vx*=0.955; this.vy*=0.955;
    this.x+=this.vx; this.y+=this.vy;
    // 画面外に出たら、そっと戻す
    if(this.x<-30||this.x>W+30||this.y<-30||this.y>H+30) this.reset(false);
  }
  draw(now){
    const blink=0.35+0.65*Math.pow(Math.max(0,Math.sin(now*0.001*this.rate+this.ph)),1.5);
    const [r,g,b]=this.col;
    const R=this.size*(3.2+2*blink);
    const grd=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,R);
    grd.addColorStop(0,`rgba(${r},${g},${b},${0.9*blink*this.warm})`);
    grd.addColorStop(0.4,`rgba(${r},${g},${b},${0.28*blink*this.warm})`);
    grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(this.x,this.y,R,0,TAU); ctx.fill();
  }
}
let embers=[];
const attract={x:0,y:0,a:0}; // 触れた所（気配）

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(W<1||H<1) return;
  const dt=Math.min(0.045,Math.max(0.001,(now-last)/1000)); last=now;
  drawNight(now);
  drawLamp(now);
  attract.a=Math.max(0,attract.a-dt*0.5); // 気配は余韻を残して消える
  ctx.globalCompositeOperation='lighter';
  for(const e of embers){ e.step(now,dt); e.draw(now); }
  ctx.globalCompositeOperation='source-over';
}

function pos(e){ const t=e.touches?e.touches[0]:e; return [t.clientX,t.clientY]; }
function touch(x,y){ attract.x=x; attract.y=y; attract.a=1;
  // 触れた所に、少し灯がともる（新しい火の粉）
  for(let i=0;i<10;i++){ const em=new Ember(); const ang=rnd(0,TAU),rad=rnd(0,40);
    em.x=x+Math.cos(ang)*rad; em.y=y+Math.sin(ang)*rad; em.vx=rnd(-4,4); em.vy=rnd(-6,2);
    embers.push(em); }
  while(embers.length>140) embers.shift();
}
cv.addEventListener('pointerdown', e=>{ const [x,y]=pos(e); touch(x,y); });
cv.addEventListener('pointermove', e=>{ if((e.buttons&1)||e.pressure>0){ const [x,y]=pos(e); attract.x=x;attract.y=y;attract.a=1; }});

resize(); lamp.set();
window.addEventListener('resize',()=>{ resize(); lamp.set(); });
embers=[]; for(let i=0;i<70;i++) embers.push(new Ember());
const hint=document.getElementById('hint');
setTimeout(()=>hint.classList.add('show'),1400);
setTimeout(()=>hint.classList.remove('show'),7000);
requestAnimationFrame(frame);
</script>
</body>
</html>
